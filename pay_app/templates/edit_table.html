{% load static %}
<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <title>Create table</title>
</head>
<body class="container">
    <form method="POST">
        {% csrf_token %}
        <table>
             <tr>

                    <td>{{ forloop.counter}}</td>
                    <td>Група</td>
                    <td>Дата створення</td>

                    <td>Валюта</td>
                    <td>Платіжна система</td>
                    <td>Проплачено до</td>
                    <td>Посилання</td>
                    <td>Стан</td>
                    <td>Логін</td>
                    <td>Пароль</td>
                    <td>IP</td>
            </tr>
            <tr class='colMS'>
                <td> {{ forloop.counter}} </td>
                <td> <input type="text"  name="groups" value="{{object_l.groups}}" /></td>
                <td> <input type="text"  name="create_date" value="{{object_l.create_date|date:"Y-m-d"}}"/></td>
                <td> <input type="text"  name="service" value="{{object_l.service}}" /></td>
                <td> <input type="text" name="type_source" value="{{object_l.type_source}}">
{#                    <select value="{{object_l.type_source}}" name="type_source">#}
{#                          <option value="BTC">BTC</option>#}
{#                          <option value="WM">WM</option>#}
{#                          <option value="BTC|WM">BTC|WM</option>#}
{#                    </select>#}
                </td>
                <td> <input type="text"  name="price_per_month" value="{{object_l.price_per_month}}" /></td>
                <td> <input type="text"  name="currency" value="{{object_l.currency}}" /></td>
{#                    <select value="{{object_l.currency}}" name="currency">#}
{#                          <option value="USD">USD</option>#}
{#                          <option value="EURO">EURO</option>#}
{#                          <option value="UAH">UAH</option>#}
{#                          <option value="rub">rub</option>#}
{#                    </select>#}
                </td>
                <td> <input type="text" name="pay_sys" value="{{object_l.pay_sys}}" /></td>
{#                    <select value="{{object_l.pay_sys}}" name="pay_sys">#}
{#                            <option value="VPS">VPS</option>#}
{#                          <option value="site">site</option>#}
{#                          <option value="proxy">proxy</option>#}
{#                    </select>#}
                </td>
                <td> <input type="text"  name="paid_up_to" value={{object_l.paid_up_to|date:"Y-m-d"}}></td>
                <td> <input type="url"  name="link" value="{{object_l.link}}"/></td>
                <td> <input type="text" name="status" value="{{object_l.status}}"/></td>
{#                    <select value="{{object_l.status}}" name="status">#}
{#                          <option value="active">active</option>#}
{#                          <option value="not active">not active</option>#}
{#                    </select>#}
                </td>
                <td> <input type="text"  name="email_login" value="{{object_l.email_login}}" /></td>
{#                <td> <input type="password"  name="password" value="{{object_l.password}}" /></td>#}
                <td>
                    <label class="">
                        <input type="password" name="password" value={{ object_l.password }} id='id_password'>
                        <input type="checkbox" onclick="myFunction()">
                   </label>
                </td>
                    <script>
                            function myFunction() {
                              var x = document.getElementById('id_password');
                              if (x.type === "password") {
                                x.type = "text";
                              } else {
                                x.type = "password";
                              }
                            }
                    </script>
                <td> <input type="text"  name="ip" value="{{object_l.ip}}" /></td>
            </tr>
        </table>
        <input type="submit"  class="btn_pay" value="Save" >
    </form>
        <a href="{% url 'app:edit_page' %}"><button>Back</button></a>

</body>
</html>
