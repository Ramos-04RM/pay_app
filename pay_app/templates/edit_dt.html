{% extends 'index.html' %}
{% load static %}

{% block title %}
  <title>Change date</title>
{% endblock %}

{% block table %}
  <section class="form-card form-card--narrow">
    <div class="table-card__header table-card__header--compact">
      <div>
        <h2 class="section-title">Оновити дату оплати</h2>
        <p class="section-subtitle">Поточна дата: <strong>{{ object_l.paid_up_to|date:"d.m.Y" }}</strong></p>
      </div>
    </div>

    <form method="POST" class="date-edit-form date-edit-form--card">
      {% csrf_token %}
      <div class="form-inline-row">
        <label class="form-field form-field--inline" for="id_paid_up_to">
          <span>Нова дата</span>
          <input id="id_paid_up_to" type="date" name="paid_up_to" value="{{ object_l.paid_up_to|date:'Y-m-d' }}">
        </label>
        <button type="submit" class="btn_add">Save</button>
      </div>
    </form>
  </section>
{% endblock %}

{% block edit_forms %}{% endblock %}
{% block cabinet %}{% endblock %}
